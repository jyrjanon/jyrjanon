<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140">
  <style>
    text { font: 700 52px 'Courier New', monospace; letter-spacing: 4px; text-anchor: middle; }
    .base { fill: #ffffff; }
    .red  { fill: #ff2e63; mix-blend-mode: screen; animation: g1 2.4s infinite steps(1); }
    .cyan { fill: #08f7fe; mix-blend-mode: screen; animation: g2 2.4s infinite steps(1); }
    .base { animation: shake 2.4s infinite steps(1); }

    @keyframes g1 {
      0%, 100% { transform: translate(0, 0); }
      8%  { transform: translate(-5px, 2px) skewX(-10deg); }
      10% { transform: translate(4px, -2px); }
      12% { transform: translate(0, 0); }
      55% { transform: translate(6px, 1px) skewX(12deg); }
      58% { transform: translate(-3px, 0); }
      60% { transform: translate(0, 0); }
    }
    @keyframes g2 {
      0%, 100% { transform: translate(0, 0); }
      9%  { transform: translate(5px, -2px) skewX(8deg); }
      11% { transform: translate(-4px, 2px); }
      13% { transform: translate(0, 0); }
      56% { transform: translate(-6px, -1px) skewX(-12deg); }
      59% { transform: translate(3px, 0); }
      61% { transform: translate(0, 0); }
    }
    @keyframes shake {
      0%, 100% { opacity: 1; }
      9%  { opacity: 0.8; }
      10% { opacity: 1; }
      57% { opacity: 0.7; }
      58% { opacity: 1; }
    }
  </style>

  <rect width="100%" height="100%" fill="#0d1117"/>
  <text class="red"  x="400" y="85">JAYRAJSINH RANA</text>
  <text class="cyan" x="400" y="85">JAYRAJSINH RANA</text>
  <text class="base" x="400" y="85">JAYRAJSINH RANA</text>
</svg>
